version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: siid_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: siid_flash
      MYSQL_USER: siid_user
      MYSQL_PASSWORD: siid_secure_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siid_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      MYSQL_URL: mysql+pymysql://siid_user:siid_secure_password@db:3306/siid_flash
      JWT_SECRET: production-jwt-secret-replace-in-env
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost:3001", "https://*.vercel.app"]'
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ./app:/app/app
    command: /bin/sh -c "python migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  db_data:
